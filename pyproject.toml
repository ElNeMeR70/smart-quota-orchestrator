[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-quota-orchestrator"
version = "13.0.0"
description = "Autonomous AI Engineering OS (v13.0 Zenith: 53 Zero-Dep MCP tools, 67 CLI commands, 1-Cmd Autopilot, 8-Gate PR Shield, Cloud FinOps Guard, Repo-DNA, Surgical AST Mutator, <15ms Hook Firewall & Live $USD ROI Ledger)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "ElNeMeR", email = "tt21913@gmail.com" }]
keywords = ["ai-agents", "mcp", "mcp-server", "antigravity", "claude-code", "cursor", "windsurf", "vscode", "token-optimization", "finops", "sast", "code-review", "bm25", "code-graph", "kv-cache", "rtl"]
dependencies = []

[project.urls]
Homepage = "https://sqo.elnemer-ai.com"
Repository = "https://github.com/ElNeMeR70/smart-quota-orchestrator"

[project.scripts]
sqo = "sqo:main"
sqo-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["sqo", "mcp_server"]
include-package-data = true
