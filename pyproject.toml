[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-quota-orchestrator"
version = "7.0.0"
description = "Autonomous AI Agent Quota, Context-Compression & Multi-Agent OS Layer (v7.0: 20 MCP tools, 33 CLI commands, Live Localhost Web Command Center, Prompt/Log Compressor, Framework Auto-Bootstrapper, Context-Rot Monitor, Stateful Shield Hooks & Live $USD ROI Ledger)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "ElNeMeR", email = "tt21913@gmail.com" }]
keywords = ["ai-agents", "mcp", "antigravity", "claude-code", "cursor", "token-optimization", "bm25", "code-graph", "kv-cache"]
dependencies = []

[project.urls]
Homepage = "https://sqo.elnemer-ai.com"
Repository = "https://github.com/ElNeMeR70/smart-quota-orchestrator"

[project.scripts]
sqo = "sqo:main"
sqo-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["sqo", "mcp_server"]
include-package-data = true
