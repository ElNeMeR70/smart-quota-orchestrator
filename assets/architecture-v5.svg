    <text x="60" y="294" fill="#FBBF24" font-weight="700">2. PreToolUse (4-in-1 Active Interceptor &lt;15ms)</text>
    <text x="76" y="313">• Blocks &gt;50KB lockfiles, sourcemaps &amp; unbounded shell cat dumps</text>
    <text x="76" y="331">• Deduplicates unchanged file re-reads via (path, mtime_ns, range)</text>
    <text x="76" y="349">• Auto-Clamps blind reads on &gt;1,200-line monoliths to L1-L280</text>
    <text x="76" y="367">• Breaks 3x consecutive identical failing shell command loops</text>
