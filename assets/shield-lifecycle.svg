<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="100%">
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F5F8FF"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="330" rx="20" fill="url(#bgLight)" stroke="#C7D2FE" stroke-width="1.8"/>

  <text x="550" y="38" text-anchor="middle" fill="#0F172A" font-family="Segoe UI, Inter, sans-serif" font-size="19" font-weight="800">
    HOW THE 3-STAGE STATEFUL HOOK FIREWALL PROTECTS EVERY TURN IN &lt;15ms
  </text>

  <!-- Box 1: SessionStart -->
  <rect x="35" y="64" width="310" height="236" rx="16" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.8"/>
  <rect x="52" y="80" width="195" height="26" rx="7" fill="#0284C7"/>
  <text x="149" y="98" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800">STAGE 1: SessionStart</text>
  <g font-family="Segoe UI, sans-serif" font-size="12.8" fill="#334155" font-weight="600">
    <text x="52" y="130" fill="#0369A1" font-weight="800">Turn-0 Warm Memory Recall</text>
    <text x="52" y="155">• Reads .sqo/memory.db + Hive-Mind</text>
    <text x="52" y="178">• Injects top 8 architecture facts</text>
    <text x="52" y="201">• Skips 15,000–30,000 tokens of</text>
    <text x="52" y="220">  blind cold-start repo wandering</text>
    <text x="52" y="252" fill="#059669" font-weight="800">✔ 100% KV-Cache Prefix Safe</text>
    <text x="52" y="274" fill="#64748B" font-size="11.5">(Protects your 90% cached-token discount!)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 352 182 L 386 182" stroke="#D97706" stroke-width="3" fill="none"/>
  <polygon points="386,176 398,182 386,188" fill="#D97706"/>

  <!-- Box 2: PreToolUse -->
  <rect x="404" y="64" width="315" height="236" rx="16" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8"/>
  <rect x="421" y="80" width="195" height="26" rx="7" fill="#D97706"/>
  <text x="518" y="98" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800">STAGE 2: PreToolUse (&lt;15ms)</text>
  <g font-family="Segoe UI, sans-serif" font-size="12.8" fill="#334155" font-weight="600">
    <text x="421" y="130" fill="#B45309" font-weight="800">4-in-1 Pre-Billing Interceptor</text>
    <text x="421" y="155">1. Denies &gt;50KB lockfiles &amp; .map</text>
    <text x="421" y="178">2. Blocks duplicate unchanged reads</text>
    <text x="421" y="201">3. Auto-clamps &gt;1,200-line files</text>
    <text x="421" y="220">   via overwrite: {L1..L280}</text>
    <text x="421" y="245">4. Halts 3rd identical failing cmd</text>
    <text x="421" y="274" fill="#059669" font-weight="800">✔ Blocks waste BEFORE API billing!</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 726 182 L 760 182" stroke="#059669" stroke-width="3" fill="none"/>
  <polygon points="760,176 772,182 760,188" fill="#059669"/>

  <!-- Box 3: PostToolUse -->
  <rect x="778" y="64" width="287" height="236" rx="16" fill="#FFFFFF" stroke="#059669" stroke-width="1.8"/>
  <rect x="795" y="80" width="195" height="26" rx="7" fill="#059669"/>
  <text x="892" y="98" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800">STAGE 3: PostToolUse</text>
  <g font-family="Segoe UI, sans-serif" font-size="12.8" fill="#334155" font-weight="600">
    <text x="795" y="130" fill="#047857" font-weight="800">Auto-Graph &amp; $USD ROI Sync</text>
    <text x="795" y="155">• Locks (path, mtime_ns, range)</text>
    <text x="795" y="178">• Unlocks file on edit_file/write</text>
    <text x="795" y="201">• Silently captures co-edits &amp;</text>
    <text x="795" y="220">  bugfixes in memory_graph.db</text>
    <text x="795" y="252">• Records saved tokens &amp; $USD</text>
    <text x="795" y="274" fill="#4F46E5" font-weight="800">  into live roi_ledger.db (`sqo roi`)</text>
  </g>
